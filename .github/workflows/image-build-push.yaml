name: Image Build Push

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    permissions:
      contents: read
    concurrency:
      group: test-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Go format check
        run: test -z "$(gofmt -l . | grep -v '^vendor/' || true)"

      - name: Go tests
        run: go test ./... -race -count=1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: JavaScript lint and format
        run: npm run check:ci

      - name: JavaScript tests
        run: node --test $(find web/static/js -name '*.test.js')

  build:
    needs:
      - test
    permissions:
      contents: read
    concurrency:
      group: ${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=buildx-multi-arch
          cache-to: type=gha,scope=buildx-multi-arch,mode=max

  push:
    if: ${{ github.ref_type == 'tag' }}
    needs:
      - test
      - build
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/p0vidl0/mylslurper:latest
            ghcr.io/p0vidl0/mylslurper:${{ github.ref_name }}
          cache-from: type=gha,scope=buildx-multi-arch
          cache-to: type=gha,scope=buildx-multi-arch,mode=max
